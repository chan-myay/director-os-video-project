{% extends "base.html" %}
{% block content %}
<header class="page-header">
  <div>
    <p class="eyebrow">Decisions</p>
    <h1>Questions For Run #{{ status.run.run_id }}</h1>
  </div>
</header>
<section class="panel">
  <h2>Requires Approval</h2>
  <ul>
    {% for item in status.blockers[:3] %}
    <li>{{ item }}</li>
    {% else %}
    <li>No unavoidable questions recorded.</li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
