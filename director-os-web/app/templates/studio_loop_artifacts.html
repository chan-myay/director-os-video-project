{% extends "base.html" %}
{% block content %}
<header class="page-header"><div><p class="eyebrow">Production Evidence</p><h1>Artifacts</h1></div></header>
<section class="panel">
  <table><tr><th>Type</th><th>Origin</th><th>Status</th><th>Path</th></tr>
  {% for artifact in detail.artifacts %}
  <tr><td>{{ artifact.artifact_type }}</td><td>{{ artifact.origin }}</td><td>{{ artifact.status }}</td><td>{{ artifact.path }}</td></tr>
  {% endfor %}
  </table>
</section>
{% endblock %}
